<body>
    <script>
      // Fix path for React Router when served under /candlelight/
      (function() {
        var base = '/candlelight';
        var path = window.location.pathname;
        if (path === base || path === base + '/') {
          window.history.replaceState(null, '', '/');
        } else if (path.indexOf(base + '/') === 0) {
          window.history.replaceState(null, '', path.slice(base.length));
        }
      })();
    </script>
    <div id="root"></div>
</body>
