<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Invitation</title>
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: black;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    video {
      max-width: 100%; max-height: 100%; object-fit: contain;
      display: none;
    }
    #start-screen {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      z-index: 10;
      cursor: pointer;
    }
    #start-screen h1 {
      font-size: 2rem;
      margin-bottom: 2rem;
      font-weight: 300;
      letter-spacing: 2px;
    }
    .play-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: 2px solid white;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }
    .play-btn:hover {
      background: rgba(255,255,255,0.3);
      transform: scale(1.1);
    }
    .play-icon {
      width: 0;
      height: 0;
      border-top: 15px solid transparent;
      border-bottom: 15px solid transparent;
      border-left: 25px solid white;
      margin-left: 10px;
    }
  </style>
</head>
<body>
  
  <div id="start-screen" onclick="startInvitation()">
    <h1>Tap to Open Invitation</h1>
    <div class="play-btn">
      <div class="play-icon"></div>
    </div>
  </div>

  <video id="invitation-video" src="/assets/video_invitation.mp4" playsinline muted></video>
  <audio id="background-audio" src="/assets/om_kalthoum_background.mp3" loop></audio>

  <script>
    function startInvitation() {
      document.getElementById('start-screen').style.display = 'none';
      const video = document.getElementById('invitation-video');
      const audio = document.getElementById('background-audio');
      
      video.style.display = 'block';
      video.play();
      audio.play();

      video.addEventListener('timeupdate', function() {
        if (video.currentTime >= 50) {
          video.pause();
          audio.pause();
        }
      });
    }
  </script>
</body>
</html>
